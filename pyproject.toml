[project]
name = "aana"
version = "0.1.0"
description = "AAna — A股智能投研助手，覆盖盘前→盘中→盘后→周末全链路"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "AAna Contributors", email = "wssaidong@users.noreply.github.com"}
]
keywords = ["stock", "a股", "量化", "投研", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "akshare>=1.14.0",
    "backtrader>=1.9.0",
    "baostock>=0.8.9",
    "duckdb>=1.0.0",  # v2026-08-23 Phase 8: analytics layer (零依赖直读 CSV/JSON)
    "pandas>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
# v2026-08-23 Phase 6A: agents 迁入 scripts/ 后,CLI 入口改为 scripts.agents.main_agent
#   旧入口 "aana = agents.main_agent:main" 已经不被任何 cron 使用,改路径与现状对齐。
#   同时用相对路径以便 pip install 后 import 路径是 scripts.agents.* 而不是根目录的 agents.*。
aana = "scripts.agents.main_agent:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# v2026-08-23 Phase 6A: agents/ 已被迁入 scripts/agents/(作为 scripts 子模块),
#   所以 packages include 里不再单独列 `agents*` — 它现在是 scripts.agents。
include = ["analysis_tools*", "backtest*", "data*", "scripts*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
